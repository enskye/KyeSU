name: Build KernelSU Kernel Module

on:
  workflow_call:
    inputs:
      kmi:
        description: 'KMI version'
        required: true
        type: string
      ddk_release:
        description: 'DDK release version'
        required: false
        default: '20260828'
        type: string
      package_name:
        description: 'package name of manager'
        required: false
        default: ''
        type: string
      expected_size:
        description: 'expected signature size'
        required: false
        default: ''
        type: string
      expected_hash:
        description: 'expected signature hash'
        required: false
        default: ''
        type: string

jobs:
  build-kernelsu-ko:
    name: Build kernelsu.ko for ${{ inputs.kmi }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk-min:${{ inputs.kmi }}-${{ inputs.ddk_release }}
      options: --privileged

    steps:
    - name: Checkout source code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Install clang 22
      # From apt.llvm.org rather than published as an image: a private GHCR
      # package of it would blow the 500 MB free storage, this is an ~84 MB
      # download. Only for the target phone's KMI; the others keep the image's
      # clang, as 5.10/5.15 fail with clang 22 (-Werror,-Wstrict-prototypes).
      if: inputs.kmi == 'android16-6.12'
      run: |
        V=22
        apt-get update -qq
        apt-get install -y -qq --no-install-recommends wget gnupg ca-certificates
        . /etc/os-release
        wget -qO /usr/share/keyrings/llvm.asc https://apt.llvm.org/llvm-snapshot.gpg.key
        echo "deb [signed-by=/usr/share/keyrings/llvm.asc] http://apt.llvm.org/$VERSION_CODENAME/ llvm-toolchain-$VERSION_CODENAME-$V main" \
          > /etc/apt/sources.list.d/llvm.list
        apt-get update -qq
        apt-get install -y -qq --no-install-recommends "clang-$V" "lld-$V" "llvm-$V"
        # kbuild here picks the compiler off PATH and ignores CC= on the command line
        mkdir -p /opt/tc/bin
        for t in clang ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-readelf llvm-strip llvm-size; do
          ln -sf "/usr/bin/$t-$V" "/opt/tc/bin/$t"
        done
        echo /opt/tc/bin >> "$GITHUB_PATH"

    - name: Build kernelsu.ko
      env:
        PACKAGE_NAME: ${{ inputs.package_name }}
        EXPECTED_SIZE: ${{ inputs.expected_size }}
        EXPECTED_HASH: ${{ inputs.expected_hash }}
      run: |
        git config --global --add safe.directory '*'

        cd kernel

        echo "=== Building kernelsu.ko for KMI: ${{ inputs.kmi }} ==="

        EXTRA_ARGS=""
        if [ -n "$PACKAGE_NAME" ]; then
          EXTRA_ARGS="$EXTRA_ARGS KSU_PACKAGE_NAME=$PACKAGE_NAME"
        fi
        if [ -n "$EXPECTED_SIZE" ]; then
          EXTRA_ARGS="$EXTRA_ARGS KSU_EXPECTED_SIZE=$EXPECTED_SIZE"
        fi
        if [ -n "$EXPECTED_HASH" ]; then
          EXTRA_ARGS="$EXTRA_ARGS KSU_EXPECTED_HASH=$EXPECTED_HASH"
        fi
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          EXTRA_ARGS="$EXTRA_ARGS KSU_IS_PR_BUILD=1"
        fi
        clang --version | head -1
        CONFIG_KSU=m CC=clang make $EXTRA_ARGS
        
        echo "=== Build completed ==="

        # Create output directory in GitHub workspace
        OUT_DIR=/github/workspace/out/aarch64
        mkdir -p $OUT_DIR

        # Copy with KMI-specific naming
        OUTPUT_NAME="${{ inputs.kmi }}_kernelsu.ko"
        cp kernelsu.ko "$OUT_DIR/$OUTPUT_NAME"
        
        echo "Copied to: $OUT_DIR/$OUTPUT_NAME"
        ls -la "$OUT_DIR/$OUTPUT_NAME"
        echo "Size: $(du -h "$OUT_DIR/$OUTPUT_NAME" | cut -f1)"
        llvm-strip -d "$OUT_DIR/$OUTPUT_NAME"
        echo "Size after stripping: $(du -h "$OUT_DIR/$OUTPUT_NAME" | cut -f1)"

    - name: Upload kernelsu.ko artifact
      uses: actions/upload-artifact@v7
      with:
        name: aarch64-${{ inputs.kmi }}-lkm
        path: /github/workspace/out/aarch64/${{ inputs.kmi }}_kernelsu.ko

